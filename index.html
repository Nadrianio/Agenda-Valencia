<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underground València · Agenda independiente</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f3;--surface:#fff;--ink:#10222b;--muted:#5a6d74;--line:#d3e0de;--sea:#1b6f7a;--gold:#f2b705;--on-sea:#fff;--chip:#dfeceb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1a20;--surface:#14262d;--ink:#e8f1f0;--muted:#92a9ae;--line:#24404a;--sea:#4fb5c1;--on-sea:#06191e;--chip:#1c343c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1a20;--surface:#14262d;--ink:#e8f1f0;--muted:#92a9ae;--line:#24404a;--sea:#4fb5c1;--on-sea:#06191e;--chip:#1c343c}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 90px}
h1{font:800 2rem/1.05 Georgia,"Times New Roman",serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--ink);font:600 .95rem inherit;font-family:inherit;padding:9px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.day{font:700 1.05rem Georgia,serif;margin:18px 0 8px;color:var(--sea)}
.ev{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--sea));border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.ev .t a{color:inherit}.ev .t{font-weight:700;margin:0 0 2px}
.ev .m{color:var(--muted);font-size:.88rem;margin:0}
.ev .time{font:700 1rem Georgia,serif;min-width:48px;text-align:center}
.ev .body{flex:1}
.tag{display:inline-block;font-size:.76rem;background:var(--chip);padding:2px 8px;border-radius:99px;margin-top:6px}
.save{border:1px solid var(--line);background:none;color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:1.15rem;cursor:pointer;flex:none}
.save[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1400}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.xadd{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none}.add summary{font-weight:700;cursor:pointer}.add label{display:block;font-size:.85rem;color:var(--muted);margin-top:10px}.add input,.add select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}.add .go{margin-top:14px;width:100%;border:0;background:var(--sea);color:var(--on-sea);font:700 1rem inherit;font-family:inherit;padding:11px;border-radius:9px;cursor:pointer}#msg{font-size:.85rem;margin:8px 0 0;color:var(--muted)}.note{font-size:.8rem;color:var(--muted);margin-top:22px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Underground València</h1>
  <p class="sub">Música, teatro, cine y arte fuera del circuito comercial.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-all" aria-selected="true">Agenda</button>
    <button role="tab" id="t-mine" aria-selected="false">Mis eventos (<span id="n">0</span>)</button>
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"><div class="empty">Cargando agenda…</div></div>
  <p class="note" id="upd"></p>
</div>
<script>
var CATS={"Música":"#d9482b","Teatro":"#8a4fd1","Cine":"#1b6f7a","Arte":"#c98f00","Otros":"#2f9e5b"};
var EV=[],cat="Todas",tab="all",saved=[],updated="";
try{saved=JSON.parse(localStorage.getItem("uv-saved2")||"[]")}catch(e){saved=[]}
function persist(){try{localStorage.setItem("uv-saved2",JSON.stringify(saved))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function key(e){return e.d+"|"+e.t}
function today(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function dayLabel(d){var s=new Date(d+"T12:00:00").toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});return s.charAt(0).toUpperCase()+s.slice(1)}
function chips(){var h="";["Todas"].concat(Object.keys(CATS)).forEach(function(c){h+='<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'});document.getElementById("chips").innerHTML=h}
function render(){
  var t0=today(),list=EV.filter(function(e){return e.d>=t0});
  document.getElementById("n").textContent=list.filter(function(e){return saved.indexOf(key(e))>=0}).length;
  document.getElementById("t-all").setAttribute("aria-selected",tab==="all");
  document.getElementById("t-mine").setAttribute("aria-selected",tab==="mine");
  var out="",last="",count=0;
  list.forEach(function(e){
    var k=key(e),on=saved.indexOf(k)>=0;
    if(tab==="mine"&&!on)return;
    if(cat!=="Todas"&&e.c!==cat)return;
    count++;
    if(e.d!==last){out+='<div class="day">'+dayLabel(e.d)+'</div>';last=e.d}
    var title=esc(e.t);
    if(/^https:\/\//.test(e.u||""))title='<a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+title+'</a>';
    out+='<div class="ev" style="--c:'+(CATS[e.c]||"#1b6f7a")+'"><div class="time">'+esc(e.h||"—")+'</div><div class="body"><p class="t">'+title+'</p><p class="m">'+esc(e.v)+'</p><span class="tag">'+esc(e.c)+' · '+esc(e.p||"Consultar")+'</span></div>'
      +'<button class="save" data-k="'+esc(k)+'" aria-pressed="'+on+'" aria-label="'+(on?"Quitar de mis eventos":"Guardar en mis eventos")+'">'+(on?"★":"☆")+'</button></div>';
  });
  if(!count)out='<div class="empty">'+(tab==="mine"?"Aún no has guardado ningún evento. Toca ☆ en la agenda para seguirlo.":"No hay eventos próximos en esta categoría.")+'</div>';
  document.getElementById("list").innerHTML=out;
  document.getElementById("upd").textContent="Agenda actualizada automáticamente cada día"+(updated?" · última vez: "+updated:"")+". Confirma horarios y precios con cada sala.";
}
document.getElementById("chips").onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;chips();render()}};
document.getElementById("list").onclick=function(e){var b=e.target.closest(".save");if(!b)return;var k=b.dataset.k,i=saved.indexOf(k);if(i<0)saved.push(k);else saved.splice(i,1);persist();render()};
document.getElementById("t-all").onclick=function(){tab="all";render()};
document.getElementById("t-mine").onclick=function(){tab="mine";render()};
chips();
fetch("events.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  EV=j.events||[];updated=j.updated?new Date(j.updated).toLocaleDateString("es-ES",{day:"numeric",month:"long"}):"";render();
}).catch(function(){document.getElementById("list").innerHTML='<div class="empty">No se pudo cargar la agenda. Inténtalo de nuevo más tarde.</div>'});
</script>
</body>
</html>
