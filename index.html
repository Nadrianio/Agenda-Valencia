<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salimos o k?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;background:#e6b68b;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--f:"Museo Slab","Roboto Slab",Georgia,"Times New Roman",serif;--bg:#e6b68b;--grad:linear-gradient(165deg,#e6b68b 0%,#dc9c98 50%,#d181a6 100%);--card:#8bbbe6;--surface:#fff;--ink:#1d1018;--muted:#3a2230;--line:#6a9bc9;--sea:#1b6f7a;--gold:#f2b705;--on-sea:#fff;--chip:#f3dfe8;color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--grad);color:var(--ink);font:400 16px/1.45 var(--f)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 90px}
h1{font:italic 900 2rem/1.05 var(--f);text-align:center;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px;text-align:center}
.tabs{display:inline-flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--ink);font-weight:900;font-size:.95rem;font-family:inherit;padding:9px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px 18px;margin-bottom:18px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:0 0 12px;padding:8px 14px;border:2px solid var(--sea);border-radius:16px;background:linear-gradient(135deg,#c4dcf4 0%,#8bbbe6 50%,#6798cf 100%);font:900 1.25rem var(--f)}
.dh .dd{font:400 .95rem var(--f);color:var(--muted)}
.dh .hoy{margin-left:auto;font:900 .72rem var(--f);background:var(--gold);color:#1a1400;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.ev{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--sea));border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.ev .time{font:900 .95rem var(--f);min-width:42px}
.ev .body{flex:1;min-width:0}
.ev .t{font-weight:900;margin:0 0 2px;overflow-wrap:anywhere}
.ev .t a{color:inherit}
.ev .m{color:var(--muted);font-size:.86rem;margin:0}
.tag{display:inline-block;font-size:.75rem;background:var(--chip);padding:2px 8px;border-radius:99px;margin-top:6px}
.save{border:1px solid var(--line);background:none;color:var(--ink);border-radius:50%;width:36px;height:36px;font-size:1.05rem;cursor:pointer;flex:none}
.save[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1400}
.cin{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cart,#b5457a);border-radius:10px;margin-bottom:9px}
.cin summary{cursor:pointer;padding:10px 12px;font-weight:900;display:flex;justify-content:space-between;gap:8px;list-style:none}
.cin summary::-webkit-details-marker{display:none}
.cin summary .ct{font-weight:400;font-size:.82rem;color:var(--muted)}
.cin ul{list-style:none;margin:0;padding:0 12px 8px}
.cin li{padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.cin li b{display:block;font-weight:900}
.cin li span{color:var(--muted);font-size:.82rem}
.none{color:var(--muted);font-size:.9rem;padding:6px 2px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.note{font-size:.8rem;color:var(--muted);margin-top:22px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Salimos o k?</h1>
  <p class="sub">Planes en València para los próximos 15 días: música, teatro, cine, museos y más.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-all" aria-selected="true">Agenda</button>
    <button role="tab" id="t-mine" aria-selected="false">Mis eventos (<span id="n">0</span>)</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"><div class="empty">Cargando agenda…</div></div>
  <p class="note" id="upd"></p>
</div>
<script>
var CATS={"Música":"#d9482b","Teatro":"#8a4fd1","Cine":"#1b6f7a","Arte":"#c98f00","Museos":"#8c5a2b","Cartelera":"#b5457a","Otros":"#2f9e5b"};
var EV=[],cat="Todas",tab="all",saved=[],updated="",days=[],ready=false;
try{saved=JSON.parse(localStorage.getItem("uv-saved2")||"[]")}catch(e){saved=[]}
function persist(){try{localStorage.setItem("uv-saved2",JSON.stringify(saved))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function key(e){return e.d+"|"+e.t}
function pad(n){return ("0"+n).slice(-2)}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function chips(){var h="";["Todas"].concat(Object.keys(CATS)).forEach(function(c){h+='<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'});document.getElementById("chips").innerHTML=h}
function isSaved(e){return e.c!=="Cartelera"&&e.c!=="Museos"&&saved.indexOf(key(e))>=0}
function visible(e){return (cat==="Todas"||e.c===cat)&&(tab==="all"||isSaved(e))}
function onDay(e,d){return e.d<=d&&d<=(e.d2||e.d)}
var SPAN=15;
function buildDays(){
  var t0=today(),out=[];
  for(var i=0;i<SPAN;i++)out.push(addDays(t0,i));
  if(tab==="mine")return out.filter(function(d){return EV.some(function(e){return onDay(e,d)&&isSaved(e)})});
  return out;
}
function card(e){
  var k=key(e),on=isSaved(e),t=esc(e.t);
  if(/^https:\/\//.test(e.u||""))t='<a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+t+'</a>';
  return '<div class="ev" style="--c:'+(CATS[e.c]||"#1b6f7a")+'"><div class="time">'+esc(e.h||"—")+'</div><div class="body"><p class="t">'+t+'</p><p class="m">'+esc(e.v)+'</p><span class="tag">'+esc(e.c)+' · '+esc(e.p||"Consultar")+'</span></div>'
   +'<button class="save" data-k="'+esc(k)+'" aria-pressed="'+on+'" aria-label="'+(on?"Quitar de mis eventos":"Guardar en mis eventos")+'">'+(on?"★":"☆")+'</button></div>';
}
function grp(label,count,items,color){
  return '<details class="cin" style="--cart:'+color+'"><summary><span>'+label+'</span><span class="ct">'+count+'</span></summary><ul>'+items.join("")+'</ul></details>';
}
function hasta(d2){return new Date(d2+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short"})}
function dayHTML(d){
  var evs=EV.filter(function(e){return onDay(e,d)&&visible(e)}).sort(function(a,b){return (a.h||"~").localeCompare(b.h||"~")});
  var dt=new Date(d+"T12:00:00"),body="";
  var reg=evs.filter(function(e){return e.c!=="Cartelera"&&e.c!=="Museos"}),mus=evs.filter(function(e){return e.c==="Museos"}),car={};
  evs.filter(function(e){return e.c==="Cartelera"}).forEach(function(e){(car[e.v]=car[e.v]||[]).push(e)});
  reg.forEach(function(e){body+=card(e)});
  if(mus.length)body+=grp("🏛 Museos y exposiciones",mus.length+(mus.length===1?" exposición":" exposiciones"),mus.map(function(e){
    var t=esc(e.t);if(/^https:\/\//.test(e.u||""))t='<a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+t+'</a>';
    return '<li><b>'+t+'</b><span>'+esc(e.v)+(e.d2?' · hasta '+hasta(e.d2):'')+' · '+esc(e.p||"Consultar")+'</span></li>'}),CATS.Museos);
  Object.keys(car).sort().forEach(function(v){
    var f=car[v];
    body+=grp("🎬 "+esc(v),f.length+" películas",f.map(function(e){return '<li><b>'+esc(e.t)+'</b><span>'+esc(e.x||e.h)+'</span></li>'}),CATS.Cartelera);
  });
  if(!body)body='<p class="none">Sin eventos este día.</p>';
  return '<section><h2 class="dh"><span>'+cap(dt.toLocaleDateString("es-ES",{weekday:"long"}))+'</span><span class="dd">'+dt.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+'</span>'+(d===today()?'<span class="hoy">Hoy</span>':'')+'</h2>'+body+'</section>';
}
function render(){
  days=buildDays();
  var t0=today();
  document.getElementById("n").textContent=EV.filter(function(e){return (e.d2||e.d)>=t0&&isSaved(e)}).length;
  document.getElementById("t-all").setAttribute("aria-selected",tab==="all");
  document.getElementById("t-mine").setAttribute("aria-selected",tab==="mine");
  var g=document.getElementById("grid");
  if(!days.length){g.innerHTML='<div class="empty">'+(tab==="mine"?"Aún no has guardado ningún evento. Toca ☆ en la agenda para seguirlo.":"No hay eventos próximos.")+'</div>'}
  else g.innerHTML=days.map(dayHTML).join("");
  document.getElementById("upd").textContent="Agenda actualizada automáticamente cada día"+(updated?" · última vez: "+updated:"")+". Se muestran 15 días, que avanzan cada día. La cartelera de los cines solo incluye las sesiones de hoy. Confirma horarios y precios con cada sala.";
}
document.getElementById("chips").onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;chips();render()}};
document.getElementById("grid").onclick=function(e){var b=e.target.closest(".save");if(!b)return;var k=b.dataset.k,i=saved.indexOf(k);if(i<0)saved.push(k);else saved.splice(i,1);persist();render()};
document.getElementById("t-all").onclick=function(){tab="all";render()};
document.getElementById("t-mine").onclick=function(){tab="mine";render()};
chips();
fetch("events.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  EV=j.events||[];updated=j.updated?new Date(j.updated).toLocaleDateString("es-ES",{day:"numeric",month:"long"}):"";ready=true;render();
}).catch(function(){document.getElementById("grid").innerHTML='<div class="empty">No se pudo cargar la agenda. Inténtalo de nuevo más tarde.</div>'});
</script>
</body>
</html>
