<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underground València · Agenda independiente</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4f3;--surface:#fff;--ink:#10222b;--muted:#5a6d74;--line:#d3e0de;--sea:#1b6f7a;--gold:#f2b705;--on-sea:#fff;--chip:#dfeceb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1a20;--surface:#14262d;--ink:#e8f1f0;--muted:#92a9ae;--line:#24404a;--sea:#4fb5c1;--on-sea:#06191e;--chip:#1c343c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0c1a20;--surface:#14262d;--ink:#e8f1f0;--muted:#92a9ae;--line:#24404a;--sea:#4fb5c1;--on-sea:#06191e;--chip:#1c343c}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 90px}
h1{font:800 2rem/1.05 Georgia,"Times New Roman",serif;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 16px}
.tabs{display:inline-flex;gap:6px;background:var(--chip);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{border:0;background:none;color:var(--ink);font:600 .95rem inherit;font-family:inherit;padding:9px 16px;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:99px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sea);color:var(--on-sea);border-color:var(--sea)}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px 18px;margin-bottom:18px}
@media (min-width:880px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dh{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--sea);font:700 1.25rem Georgia,serif}
.dh .dd{font:600 .95rem "Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--muted)}
.dh .hoy{margin-left:auto;font:700 .72rem "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--gold);color:#1a1400;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.ev{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--sea));border-radius:10px;padding:10px 12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}
.ev .time{font:700 .95rem Georgia,serif;min-width:42px}
.ev .body{flex:1;min-width:0}
.ev .t{font-weight:700;margin:0 0 2px;overflow-wrap:anywhere}
.ev .t a{color:inherit}
.ev .m{color:var(--muted);font-size:.86rem;margin:0}
.tag{display:inline-block;font-size:.75rem;background:var(--chip);padding:2px 8px;border-radius:99px;margin-top:6px}
.save{border:1px solid var(--line);background:none;color:var(--ink);border-radius:50%;width:36px;height:36px;font-size:1.05rem;cursor:pointer;flex:none}
.save[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1a1400}
.cin{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--cart,#b5457a);border-radius:10px;margin-bottom:9px}
.cin summary{cursor:pointer;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;list-style:none}
.cin summary::-webkit-details-marker{display:none}
.cin summary .ct{font-weight:500;font-size:.82rem;color:var(--muted)}
.cin ul{list-style:none;margin:0;padding:0 12px 8px}
.cin li{padding:7px 0;border-top:1px solid var(--line);font-size:.9rem}
.cin li b{display:block}
.cin li span{color:var(--muted);font-size:.82rem}
.none{color:var(--muted);font-size:.9rem;padding:6px 2px}
.more{display:block;margin:0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem inherit;font-family:inherit;padding:10px 20px;border-radius:99px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
button:focus-visible,summary:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.note{font-size:.8rem;color:var(--muted);margin-top:22px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>Underground València</h1>
  <p class="sub">Música, teatro, cine y arte fuera del circuito comercial.</p>
  <div class="tabs" role="tablist">
    <button role="tab" id="t-all" aria-selected="true">Agenda</button>
    <button role="tab" id="t-mine" aria-selected="false">Mis eventos (<span id="n">0</span>)</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"><div class="empty">Cargando agenda…</div></div>
  <div id="sentinel"></div>
  <button class="more" id="more" style="display:none">Ver 3 días más</button>
  <p class="note" id="upd"></p>
</div>
<script>
var CATS={"Música":"#d9482b","Teatro":"#8a4fd1","Cine":"#1b6f7a","Arte":"#c98f00","Cartelera":"#b5457a","Otros":"#2f9e5b"};
var EV=[],cat="Todas",tab="all",saved=[],updated="",days=[],shown=3,ready=false;
try{saved=JSON.parse(localStorage.getItem("uv-saved2")||"[]")}catch(e){saved=[]}
function persist(){try{localStorage.setItem("uv-saved2",JSON.stringify(saved))}catch(e){}}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function key(e){return e.d+"|"+e.t}
function pad(n){return ("0"+n).slice(-2)}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return iso(new Date())}
function addDays(s,n){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function chips(){var h="";["Todas"].concat(Object.keys(CATS)).forEach(function(c){h+='<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'});document.getElementById("chips").innerHTML=h}
function isSaved(e){return e.c!=="Cartelera"&&saved.indexOf(key(e))>=0}
function visible(e){return (cat==="Todas"||e.c===cat)&&(tab==="all"||isSaved(e))}
function buildDays(){
  var t0=today(),evs=EV.filter(function(e){return e.d>=t0});
  if(tab==="mine"){var s={};evs.forEach(function(e){if(isSaved(e))s[e.d]=1});return Object.keys(s).sort()}
  var max=t0;evs.forEach(function(e){if(e.d>max)max=e.d});
  var out=[],d=t0,n=0;while(d<=max&&n<150){out.push(d);d=addDays(d,1);n++}
  return out;
}
function card(e){
  var k=key(e),on=isSaved(e),t=esc(e.t);
  if(/^https:\/\//.test(e.u||""))t='<a href="'+esc(e.u)+'" target="_blank" rel="noopener">'+t+'</a>';
  return '<div class="ev" style="--c:'+(CATS[e.c]||"#1b6f7a")+'"><div class="time">'+esc(e.h||"—")+'</div><div class="body"><p class="t">'+t+'</p><p class="m">'+esc(e.v)+'</p><span class="tag">'+esc(e.c)+' · '+esc(e.p||"Consultar")+'</span></div>'
   +'<button class="save" data-k="'+esc(k)+'" aria-pressed="'+on+'" aria-label="'+(on?"Quitar de mis eventos":"Guardar en mis eventos")+'">'+(on?"★":"☆")+'</button></div>';
}
function dayHTML(d){
  var evs=EV.filter(function(e){return e.d===d&&visible(e)}).sort(function(a,b){return (a.h||"~").localeCompare(b.h||"~")});
  var dt=new Date(d+"T12:00:00"),body="";
  var reg=evs.filter(function(e){return e.c!=="Cartelera"}),car={};
  evs.filter(function(e){return e.c==="Cartelera"}).forEach(function(e){(car[e.v]=car[e.v]||[]).push(e)});
  reg.forEach(function(e){body+=card(e)});
  Object.keys(car).sort().forEach(function(v){
    var f=car[v];
    body+='<details class="cin" style="--cart:'+CATS.Cartelera+'"><summary><span>🎬 '+esc(v)+'</span><span class="ct">'+f.length+' películas</span></summary><ul>'
      +f.map(function(e){return '<li><b>'+esc(e.t)+'</b><span>'+esc(e.x||e.h)+'</span></li>'}).join("")+'</ul></details>';
  });
  if(!body)body='<p class="none">Sin eventos este día.</p>';
  return '<section><h2 class="dh"><span>'+cap(dt.toLocaleDateString("es-ES",{weekday:"long"}))+'</span><span class="dd">'+dt.toLocaleDateString("es-ES",{day:"numeric",month:"short"})+'</span>'+(d===today()?'<span class="hoy">Hoy</span>':'')+'</h2>'+body+'</section>';
}
function updateMore(){document.getElementById("more").style.display=(ready&&shown<days.length)?"block":"none"}
function render(keep){
  if(!keep)shown=3;
  days=buildDays();
  var t0=today();
  document.getElementById("n").textContent=EV.filter(function(e){return e.d>=t0&&isSaved(e)}).length;
  document.getElementById("t-all").setAttribute("aria-selected",tab==="all");
  document.getElementById("t-mine").setAttribute("aria-selected",tab==="mine");
  var g=document.getElementById("grid");
  if(!days.length){g.innerHTML='<div class="empty">'+(tab==="mine"?"Aún no has guardado ningún evento. Toca ☆ en la agenda para seguirlo.":"No hay eventos próximos.")+'</div>'}
  else g.innerHTML=days.slice(0,shown).map(dayHTML).join("");
  document.getElementById("upd").textContent="Agenda actualizada automáticamente cada día"+(updated?" · última vez: "+updated:"")+". La cartelera de los cines muestra las sesiones de hoy. Confirma horarios y precios con cada sala.";
  updateMore();
}
function more(){
  if(shown>=days.length)return;
  var from=shown;shown=Math.min(shown+3,days.length);
  document.getElementById("grid").insertAdjacentHTML("beforeend",days.slice(from,shown).map(dayHTML).join(""));
  updateMore();
}
document.getElementById("chips").onclick=function(e){var c=e.target.dataset.c;if(c){cat=c;chips();render()}};
document.getElementById("grid").onclick=function(e){var b=e.target.closest(".save");if(!b)return;var k=b.dataset.k,i=saved.indexOf(k);if(i<0)saved.push(k);else saved.splice(i,1);persist();render(true)};
document.getElementById("t-all").onclick=function(){tab="all";render()};
document.getElementById("t-mine").onclick=function(){tab="mine";render()};
document.getElementById("more").onclick=more;
if("IntersectionObserver" in window){new IntersectionObserver(function(es){if(es[0].isIntersecting&&ready)more()},{rootMargin:"300px"}).observe(document.getElementById("sentinel"))}
chips();
fetch("events.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  EV=j.events||[];updated=j.updated?new Date(j.updated).toLocaleDateString("es-ES",{day:"numeric",month:"long"}):"";ready=true;render();
}).catch(function(){document.getElementById("grid").innerHTML='<div class="empty">No se pudo cargar la agenda. Inténtalo de nuevo más tarde.</div>'});
</script>
</body>
</html>
