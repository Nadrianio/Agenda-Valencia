name: Actualizar agenda
on:
  schedule:
    - cron: "0 5 * * *"   # cada día a las 05:00 UTC
  workflow_dispatch:       # también se puede lanzar a mano
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper/scrape.py
      - run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add events.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar eventos"
            git push
          fi
